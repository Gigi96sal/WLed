[platformio]
default_envs = camera_left
src_dir = src
include_dir = include

[env]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.06.00/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -I../wled00/cinema

[env:camera_left]
build_flags =
  ${env.build_flags}
  -DCINEMA_CAMERA_ROLE=2

[env:camera_right]
build_flags =
  ${env.build_flags}
  -DCINEMA_CAMERA_ROLE=3